[package]
name = "bailey-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
description = "Fondation de langage Bailey en Rust, sans poids preentraines externes"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[dependencies]
anyhow = "1"
candle-core = "=0.11.0"
candle-nn = "=0.11.0"
clap = { version = "4", features = ["derive"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
fs2 = "0.4"
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
tempfile = "3"
